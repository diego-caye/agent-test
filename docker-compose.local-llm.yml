# Perfil de modelos locales. Levanta Ollama dentro del proyecto:
#   docker compose -f docker-compose.yml -f docker-compose.local-llm.yml up -d
# Para GPU NVIDIA, añade también docker-compose.gpu.yml.
#
# Alternativa sin este archivo: si ya tienes Ollama corriendo (nativo o en otro
# contenedor), deja OLLAMA_API_BASE=http://host.docker.internal:11434 y usa solo
# docker-compose.yml.

services:
  ollama:
    image: ollama/ollama:latest
    environment:
      # Ollama recorta el contexto en silencio si no se le indica cuánto usar.
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-16384}
      OLLAMA_HOST: 0.0.0.0:11434
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Descarga los modelos una vez y termina. El volumen los conserva.
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ollama-models:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "ollama pull ${OLLAMA_AGENT_MODEL:-gemma4} &&
       ollama pull ${OLLAMA_EMBEDDINGS_MODEL:-embeddinggemma}"
    restart: "no"

  backend:
    environment:
      LLM_PROVIDER: ollama
      EMBEDDINGS_PROVIDER: ollama
      OLLAMA_API_BASE: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  ollama-models:
