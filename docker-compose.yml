# Un solo archivo para todo el stack. Los servicios opcionales van por perfil,
# no por archivos de override: así `docker compose up -d` siempre funciona y no
# hay que recordar una cadena de `-f`.
#
#   docker compose up -d                        db + backend + frontend
#   docker compose --profile local-llm up -d    + Ollama dentro del proyecto
#
# El perfil local-llm asume GPU NVIDIA con el container toolkit instalado. Sin
# GPU (o con Ollama ya corriendo en el host, que es lo habitual en Windows),
# omite el perfil y deja OLLAMA_API_BASE_CONTAINER apuntando al host.
#
# backend y frontend montan el código fuente y recargan solos: editar un .py o
# un .tsx se ve al instante, sin `--build`. Solo hace falta reconstruir cuando
# cambian las dependencias (uv.lock, package-lock.json) o los Dockerfile.

name: asesor

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-asesor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-asesor}
      POSTGRES_DB: ${POSTGRES_DB:-asesor}
    # Puertos por defecto fuera de los habituales (5432, 8000, 5173) a propósito:
    # es normal tener otros proyectos ocupándolos. Se cambian por env.
    ports:
      - "${POSTGRES_PORT:-5490}:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-asesor} -d ${POSTGRES_DB:-asesor}"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-asesor}:${POSTGRES_PASSWORD:-asesor}@db:5432/${POSTGRES_DB:-asesor}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5190}
      # En .env apunta a localhost, que es lo que usan los scripts del host;
      # desde el contenedor hay que salir al host. Con el perfil local-llm,
      # ponlo a http://ollama:11434.
      OLLAMA_API_BASE: ${OLLAMA_API_BASE_CONTAINER:-http://host.docker.internal:11434}
      # Vacío = sin --reload (producción). Ver el command de abajo.
      RELOAD: ${BACKEND_RELOAD-1}
      # El código vive en el sistema de archivos de Windows: los eventos inotify
      # no cruzan el bind mount, así que watchfiles tiene que hacer polling.
      WATCHFILES_FORCE_POLLING: ${WATCH_POLLING:-true}
    # $$ para que lo expanda la shell del contenedor y no Compose. Una sola
    # línea a propósito: un salto aquí lo parte en dos comandos y el exec se
    # queda con el primero, sin --reload.
    command: ["sh", "-c", "exec uvicorn asesor.main:create_app --factory --host 0.0.0.0 --port 8000 $${RELOAD:+--reload --reload-dir /app/src}"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_PORT:-8090}:8000"
    volumes:
      # El paquete se instala en modo editable, así que el contenedor ejecuta
      # directamente lo que hay aquí montado.
      - ./backend/src:/app/src
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  frontend:
    build: ./frontend
    environment:
      VITE_API_TARGET: http://backend:8000
      # Mismo motivo que WATCHFILES_FORCE_POLLING en el backend.
      VITE_POLLING: ${WATCH_POLLING:-true}
    ports:
      - "${FRONTEND_PORT:-5190}:5173"
    volumes:
      # Solo lo que se edita: node_modules se queda el de la imagen.
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # El dev server de Vite tarda unos segundos en atender; sin healthcheck
      # "docker compose ps" lo daba por listo antes de que respondiera.
      # 127.0.0.1 y no localhost: dentro del contenedor localhost resuelve
      # primero a ::1 y el dev server de Vite solo escucha en IPv4.
      test:
        ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  ollama:
    profiles: ["local-llm"]
    # Versión fija, no :latest: una imagen que cambia sola en cada pull puede
    # dejar de entender OLLAMA_THINK o el formato de /api/show que usa el
    # descubrimiento de modelos (infrastructure/llm/ollama_discovery.py) sin
    # ningún aviso. 0.24.0 es la que está probada en este proyecto (ADR-003).
    image: ollama/ollama:0.24.0
    environment:
      # Ollama recorta el contexto en silencio si no se le indica cuánto usar.
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-16384}
      OLLAMA_HOST: 0.0.0.0:11434
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Descarga los cuatro modelos que la app de verdad usa (agente, guardrail
  # -que también sirve de eval y de título-, respaldo y embeddings) una vez;
  # el volumen los conserva entre reinicios. Antes solo bajaba dos: backend
  # arrancaba igual, pero cualquier turno que tocara el respaldo o el
  # guardrail fallaba con "model not found" la primera vez que hacía falta.
  #
  # Cada uno con un tag explícito, no :latest — mismo motivo que la imagen
  # de arriba, y además así lo que se descarga aquí es siempre exactamente lo
  # que AGENT_MODEL/GUARDRAIL_MODEL/FALLBACK_MODEL/EMBEDDINGS_MODEL esperan
  # encontrar (ver .env.example): un tag suelto podría resolver a una
  # variante distinta a la que el resto de la app tiene configurada.
  ollama-pull:
    profiles: ["local-llm"]
    image: ollama/ollama:0.24.0
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ollama-models:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "ollama pull ${OLLAMA_AGENT_MODEL:-gemma4:12b} &&
       ollama pull ${OLLAMA_GUARDRAIL_MODEL:-qwen3:4b-instruct} &&
       ollama pull ${OLLAMA_FALLBACK_MODEL:-llama3.2:3b} &&
       ollama pull ${OLLAMA_EMBEDDINGS_MODEL:-embeddinggemma:300m}"
    restart: "no"

volumes:
  dbdata:
  ollama-models:
